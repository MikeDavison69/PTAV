# ===============================================================================================
# avscan.conf
# This is the avscan.sh configuration file
# ===============================================================================================
# Do not change keyword "option" - this is for specifying the logfiles for the avscan.sh script
# YOU CANNOT USE "OPTION" AS A SCAN CONFIGURATION NAME.
#
# log_history: Specifies the number of days history to retain for the logfiles.
#
# log_directory: Specifies the directory where the output from the avscan.sh script is kept.
#
# log level: Email log content. 1 = Minimal (head and tail)
#                               2 = Head, tail and errors (but not skipped or OK files) *DEFAULT*
#                               3 = Everything (could be very large!)
#
# log_error: Email action.      0 = Email every time avscan is run
#                               1 = Email only when the scan return code <> 0 (ie: error or threat found)
#
# avupdate_email: Email action. 0 = Email every time avupdate is run
#                               1 = Email only when the avupdate return code <> 0 (ie: error or fault)
#
option log_history 14
option log_directory /opt/sgav/log
option log_level 2
option log_error 1 
option avupdate_email 0
# ===============================================================================================
#
# User scan configuration options
# ignore comments
# options
# --ignorelinks         default         Ignore symbolic links
# --noignorelinks                       Follow all symbolic links
# --noheuristics                        Turn off heuristic analysis
# --nomacros                            Do not scan OLE documents for compound macros
# --pup                                 Scan for Potentially unwanted prograps - default is to NOT scan this
# --mime                                Scan MIME encoded files - default is to NOT scan this
# --arc                                 Scan within archive files - default is to NOT scan this
# --exeonly                             Do not scan non-executable files - default is to scan all files
# --maxwait                             Maximum number of seconds to spend scanning a file - the default is 300s
# --timeout                             Maximum number of seconds to spend running a scan - default is 0 (no limit)
# --delay                               Microsecond beat between scans - default is 0, CPU limiting use 1000
# --clean                               Attempt to clean infected files - not recommended for OS scans
# --quar                                If clean fails, quarantine - not recommended for OS scans
# --loglevel                            Number of directory levels to show in the log - default is 99
# --quiet                               Prints minimal output to stdout
#
# Format of individual configuration lines
#
# name_of_scan keyword data
# |            |       |
# |            |       +---- Either valid avscan options, or directory names.
# |            |
# |            +------------ Valid keywords:  opt     Used to specify avscan options.
# |                                           inc     Directories to include in the scan.
# |                                           exc     Directories to exclude from the scan.
# |
# +------------------------- A unique name given to each scan (must be the same on every line)
#
# ===============================================================================================
# User scan configurations are to be added below this line



# -------------------------------------------------------------------------------------------------
# Examples:
#
# These examples are provided for you to help you understand how to create a scan configuration using this file
#
# -------------------------------------------------------------------------------------------------
# "fast" will scan the entire filesystem looking for known executable viruses/malware and unwanted
#        programs. It will use as much resource as necessary.
fast opt --noheuristics --nomacros --pup --exeonly --maxwait 10
fast inc /
fast exc /var/adm/ras/livedump


# -------------------------------------------------------------------------------------------------
# "slow" will scan the entire system looking at every file and also in archives.  It will use as much
#        resource as necessary.  It could take a long time.
slow opt --pup --arc
slow inc /
slow exc /var/adm/ras/livedump


# -------------------------------------------------------------------------------------------------
# "home" will scan only the /home directory structure, excluding /home/arc*.  It will use as much resource
#        as necesary.
home opt
home inc /home
home exc /home/arc*


# -------------------------------------------------------------------------------------------------
# "root_only" will scan the root "/" filesystem only, excluding other filesystems as listed.  It will limit
              the amount of resource used by the "delay" parameter
root_only opt --nomacros --pup --arc --maxwait 60 --delay 1000
root_only inc /
root_only exc /usr:/var:/tmp:/opt:/dev:/appfs:/appfs2


# -------------------------------------------------------------------------------------------------
# "quick" will scan the root "/" filesystem only, excluding other filesystems as listed (note use of
#          wildcards is allowed)
quick opt --noheuristics --nomacros
quick inc /
quick exc /usr
quick exc /var
quick exc /tmp
quick exc /ad*
quick exc /lpp*
quick exc /proc
quick exc /dev
quick exc /opt
quick exc /esa*

# End of the file
